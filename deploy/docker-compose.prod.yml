# Production on a server whose data centre is in Türkiye (spec §4.3, K12).
#   cd deploy && cp .env.prod.example .env.prod && docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      POSTGRES_DB: postgres
      ROASTCOST_MIGRATOR_PASSWORD: ${ROASTCOST_MIGRATOR_PASSWORD:?}
      ROASTCOST_APP_PASSWORD: ${ROASTCOST_APP_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../apps/api/scripts/docker-init.sh:/docker-entrypoint-initdb.d/10-roastcost.sh:ro
      - ../apps/api/scripts/bootstrap.sql:/roastcost/bootstrap.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options: { max-size: '10m', max-file: '3' } # short log retention (spec §13)
    networks: [internal]

  migrate:
    image: roastcost-api:latest
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command: ['node', 'dist/migrate.js']
    environment:
      MIGRATOR_DATABASE_URL: postgres://roastcost_migrator:${ROASTCOST_MIGRATOR_PASSWORD}@db:5432/roastcost
    depends_on: { db: { condition: service_healthy } }
    restart: 'no'
    logging: *logging
    networks: [internal]

  api:
    image: roastcost-api:latest
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://roastcost_app:${ROASTCOST_APP_PASSWORD}@db:5432/roastcost
      TRUST_PROXY: 'true'
      HOST: 0.0.0.0
      PORT: '3000'
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    logging: *logging
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    logging: *logging
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
networks:
  internal:
