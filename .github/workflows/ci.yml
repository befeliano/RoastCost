name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_PG_SUPERUSER_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Every import is declared in its own package.json
        run: pnpm check:deps
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: API production bundle builds
        run: pnpm --filter @roastcost/api build
      - name: Mobile bundle builds (catches missing modules / wrong import paths tsc can't see)
        run: pnpm --filter @roastcost/mobile exec expo export --platform web --output-dir /tmp/rc-web-ci
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
